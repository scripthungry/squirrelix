name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    # Every matrix cell is a hard gate: no continue-on-error.
    # fail-fast false so we see all version failures in one run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
            quality: false
          - elixir: "1.19.4"
            otp: "28.0"
            quality: false
          - elixir: "1.20.0"
            otp: "28.0"
            quality: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # Soft floor only: warn in the job summary if coverage dips below this.
      # Not a hard fail until we lock a baseline for a quality gate.
      COVERAGE_SOFT_FLOOR: "70"

    steps:
      - uses: actions/checkout@v4

      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Cache Dialyzer PLT
        if: matrix.quality
        uses: actions/cache@v4
        with:
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash
            priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors

      - name: Format check
        if: matrix.quality
        run: mix format --check-formatted

      - name: Credo
        if: matrix.quality
        run: mix credo --strict --all

      - name: Dialyzer
        if: matrix.quality
        run: mix dialyzer --format github

      - name: ExDNA (no clones)
        if: matrix.quality
        run: mix ex_dna --max-clones 0

      - name: Reach architecture and smells
        if: matrix.quality
        run: mix reach.check --arch --smells --strict

      - name: Run tests
        if: ${{ !matrix.quality }}
        run: mix test

      - name: Run tests with coverage
        if: matrix.quality
        run: |
          set -o pipefail
          mix coveralls.html 2>&1 | tee coverage-output.txt

      - name: Publish coverage summary
        if: matrix.quality && always()
        run: |
          set -euo pipefail
          TOTAL_LINE=$(grep -E '\[TOTAL\]' coverage-output.txt | tail -n1 || true)
          PCT=$(printf '%s\n' "$TOTAL_LINE" | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1 || true)

          {
            echo "## Test coverage"
            echo
            if [ -n "$PCT" ]; then
              echo "**${PCT}%** total line coverage (ExCoveralls)"
            else
              echo "Could not parse coverage percentage from test output."
            fi
            echo
            echo "HTML report uploaded as the \`coverage-html\` artifact."
            if [ -n "${COVERAGE_SOFT_FLOOR:-}" ] && [ -n "$PCT" ]; then
              echo
              echo "Soft floor: ${COVERAGE_SOFT_FLOOR}% (warning only; does not fail CI)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${COVERAGE_SOFT_FLOOR:-}" ] && [ -n "$PCT" ]; then
            awk -v pct="$PCT" -v floor="$COVERAGE_SOFT_FLOOR" 'BEGIN {
              if ((pct + 0) < (floor + 0)) {
                printf "::warning::Coverage %.1f%% is below soft floor %s%% (not failing CI)\n", pct, floor
              } else {
                printf "Coverage %.1f%% meets soft floor %s%%\n", pct, floor
              }
            }'
          fi

      - name: Upload coverage HTML report
        if: matrix.quality && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cover/
          if-no-files-found: ignore
          retention-days: 14

  # Single required check: fails if any matrix cell failed/cancelled.
  # Branch protection can watch this job name instead of one Elixir cell.
  ci-success:
    name: CI success
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix cell to succeed
        run: |
          result="${{ needs.test.result }}"
          echo "Matrix aggregate result: ${result}"
          if [ "$result" != "success" ]; then
            echo "CI failed: one or more Elixir/OTP matrix cells did not succeed."
            exit 1
          fi
