name: Hex Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish the current mix.exs version to Hex'
        required: true
      mode:
        description: "What to publish (docs = docs only for the existing package version)"
        required: true
        type: choice
        options:
          - package
          - docs
          - all
        default: all

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    if: github.repository == 'scripthungry/squirrelix'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.5"

      - name: Confirm manual publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "Refusing to publish: confirmation was not exactly 'publish'"
            exit 1
          fi

      - name: Verify tag matches mix.exs version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Parse @version from mix.exs without Mix so we don't need deps yet.
          version="$(sed -n 's/^[[:space:]]*@version[[:space:]]*"\([^"]*\)".*/\1/p' mix.exs | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not parse @version from mix.exs"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match mix.exs version $version"
            exit 1
          fi

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict --all
      - run: mix dialyzer
      - run: mix ex_dna --max-clones 0
      - run: mix reach.check --arch --smells --strict
      - run: mix test

      - name: Publish package and docs
        if: github.event_name == 'push' || inputs.mode == 'all' || inputs.mode == 'package'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: dev
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "HEX_API_KEY secret is not set"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "package" ]; then
            mix hex.publish package --yes
          else
            mix hex.publish --yes
          fi

      - name: Publish docs only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'docs'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: dev
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "HEX_API_KEY secret is not set"
            exit 1
          fi
          mix hex.publish docs --yes
